<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img" aria-label="Teknisk snittegning af en hytte med nummererede bygningsdele">
  <defs>
    <linearGradient id="papirT" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0d2a4f"/><stop offset="1" stop-color="#081d3a"/>
    </linearGradient>
    <pattern id="git" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 H 0 V 50" fill="none" stroke="#1d4a80" stroke-width="1" opacity="0.55"/>
    </pattern>
    <pattern id="skravering" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#5b93cc" stroke-width="3" opacity="0.75"/>
    </pattern>
    <pattern id="skravering2" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#3f77ad" stroke-width="3" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1600" height="1100" fill="url(#papirT)"/>
  <rect width="1600" height="1100" fill="url(#git)"/>

  <!-- ramme og hjørnemærker -->
  <g stroke="#8bbcdf" stroke-width="3" fill="none" opacity="0.9">
    <rect x="46" y="46" width="1508" height="1008"/>
    <rect x="62" y="62" width="1476" height="976" stroke-width="1.5" opacity="0.55"/>
  </g>

  <g stroke="#dbe9ff" stroke-width="2.5" opacity="0.85">
    <!-- midterlinje -->
    <path d="M 800 132 V 946" stroke-dasharray="34 12 6 12"/>
    <!-- snitmarkering A–A -->
    <path d="M 150 520 H 276 M 1324 520 H 1454" stroke-dasharray="30 10 6 10"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#ffd166">
    <circle cx="150" cy="520" r="24" fill="none" stroke="#ffd166" stroke-width="3"/>
    <text x="142" y="530">A</text>
    <circle cx="1454" cy="520" r="24" fill="none" stroke="#ffd166" stroke-width="3"/>
    <text x="1446" y="530">A</text>
  </g>

  <!-- taget -->
  <g>
    <path d="M 268 442 L 800 168" stroke="#dbe9ff" stroke-width="24" stroke-linecap="square"/>
    <path d="M 800 168 L 1332 442" stroke="#dbe9ff" stroke-width="24" stroke-linecap="square"/>
    <path d="M 268 442 L 800 168 L 1332 442" fill="none" stroke="#ffd166" stroke-width="3" opacity="0.55"/>
    <path d="M 268 462 L 800 188 L 1332 462" fill="none" stroke="#7fb2e8" stroke-width="3" stroke-dasharray="16 10"/>
    <path d="M 800 168 V 132" stroke="#7fb2e8" stroke-width="3"/>
    <!-- ovenlys -->
    <g transform="rotate(-25.7 555 315)">
      <rect x="480" y="298" width="150" height="34" rx="4" fill="#0d2a4f" stroke="#ffd166" stroke-width="5"/>
      <path d="M 505 298 V 332 M 555 298 V 332 M 605 298 V 332" stroke="#ffd166" stroke-width="3" opacity="0.8"/>
      <rect x="480" y="298" width="150" height="34" rx="4" fill="url(#skravering2)" opacity="0.5"/>
    </g>
    <!-- skorsten -->
    <rect x="848" y="164" width="68" height="132" fill="#122f56" stroke="#dbe9ff" stroke-width="5"/>
    <rect x="848" y="164" width="68" height="132" fill="url(#skravering)" opacity="0.65"/>
    <rect x="836" y="152" width="92" height="16" rx="3" fill="#dbe9ff" opacity="0.85"/>
    <path d="M 862 300 h 40" stroke="#dbe9ff" stroke-width="4"/>
  </g>

  <!-- vægge og rum -->
  <g>
    <rect x="300" y="160" width="1000" height="622" fill="#0e2a50" opacity="0.35"/>
    <rect x="300" y="442" width="1000" height="340" fill="#0e2a50" opacity="0.55"/>
    <!-- ydervægge -->
    <rect x="300" y="442" width="26" height="340" fill="#122f56" stroke="#dbe9ff" stroke-width="4"/>
    <rect x="300" y="442" width="26" height="340" fill="url(#skravering)" opacity="0.6"/>
    <rect x="1274" y="442" width="26" height="340" fill="#122f56" stroke="#dbe9ff" stroke-width="4"/>
    <rect x="1274" y="442" width="26" height="340" fill="url(#skravering)" opacity="0.6"/>
    <!-- indervæg -->
    <rect x="700" y="442" width="18" height="340" fill="#122f56" stroke="#7fb2e8" stroke-width="3"/>
    <!-- loft -->
    <rect x="326" y="470" width="948" height="18" fill="#122f56" stroke="#7fb2e8" stroke-width="3"/>
    <rect x="326" y="470" width="948" height="18" fill="url(#skravering2)" opacity="0.45"/>
    <!-- vinduet i gavlen -->
    <g>
      <rect x="640" y="540" width="120" height="120" rx="4" fill="#0b2545" stroke="#dbe9ff" stroke-width="5"/>
      <path d="M 680 540 V 660 M 720 540 V 660 M 640 600 H 760" stroke="#dbe9ff" stroke-width="3.5"/>
      <path d="M 640 540 L 760 660" stroke="#7fb2e8" stroke-width="2" opacity="0.7"/>
      <path d="M 760 540 L 640 660" stroke="#7fb2e8" stroke-width="2" opacity="0.7"/>
      <path d="M 640 668 h 120" stroke="#ffd166" stroke-width="4"/>
    </g>
    <!-- gulv -->
    <rect x="300" y="780" width="1000" height="22" fill="#122f56" stroke="#dbe9ff" stroke-width="5"/>
    <rect x="300" y="780" width="1000" height="22" fill="url(#skravering)" opacity="0.5"/>
    <g stroke="#7fb2e8" stroke-width="3">
      <path d="M 350 802 V 848 M 410 802 V 848 M 470 802 V 848 M 530 802 V 848 M 590 802 V 848 M 650 802 V 848 M 710 802 V 848 M 770 802 V 848 M 830 802 V 848 M 890 802 V 848 M 950 802 V 848 M 1010 802 V 848 M 1070 802 V 848 M 1130 802 V 848 M 1190 802 V 848 M 1250 802 V 848"/>
    </g>
    <path d="M 300 850 H 1300" stroke="#7fb2e8" stroke-width="4"/>
    <!-- fundament -->
    <rect x="300" y="850" width="1000" height="56" fill="#122f56" stroke="#dbe9ff" stroke-width="5"/>
    <rect x="300" y="850" width="1000" height="56" fill="url(#skravering2)" opacity="0.7"/>
    <!-- trappe -->
    <g fill="none" stroke="#dbe9ff" stroke-width="5" stroke-linejoin="miter">
      <path d="M 1080 780 V 757 H 1100 V 734 H 1120 V 711 H 1140 V 688 H 1160 V 665 H 1180 V 642 H 1200 V 620 H 1220"/>
    </g>
    <path d="M 1070 620 V 780" stroke="#7fb2e8" stroke-width="3" stroke-dasharray="14 9"/>
  </g>

  <!-- mål -->
  <g stroke="#ffd166" stroke-width="2.5" fill="none">
    <path d="M 300 955 H 1300"/>
    <path d="M 300 940 V 970 M 1300 940 V 970"/>
    <path d="M 306 948 l -14 7 l 14 7 z" fill="#ffd166" stroke="none"/>
    <path d="M 1294 948 l 14 7 l -14 7 z" fill="#ffd166" stroke="none"/>
    <path d="M 1440 168 V 906"/>
    <path d="M 1424 168 H 1456 M 1424 906 H 1456"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="27" font-weight="700" fill="#ffd166">
    <text x="760" y="938">10 000</text>
    <text x="1452" y="548" transform="rotate(-90 1452 548)">7 200</text>
  </g>

  <!-- henvisninger -->
  <g font-family="system-ui, sans-serif" font-size="26" font-weight="800">
    <g stroke="#ffd166" stroke-width="2.5">
      <path d="M 1180 200 L 1064 292" fill="none"/>
      <path d="M 600 190 L 562 302" fill="none"/>
      <path d="M 985 150 L 900 200" fill="none"/>
      <path d="M 170 560 L 292 592" fill="none"/>
      <path d="M 700 470 L 700 532" fill="none"/>
      <path d="M 780 890 L 856 830" fill="none"/>
      <path d="M 1180 940 L 1032 892" fill="none"/>
      <path d="M 1330 640 L 1224 628" fill="none"/>
    </g>
    <g fill="#0b2545" stroke="#ffd166" stroke-width="3">
      <circle cx="1180" cy="200" r="24"/><circle cx="600" cy="190" r="24"/>
      <circle cx="985" cy="150" r="24"/><circle cx="170" cy="560" r="24"/>
      <circle cx="700" cy="470" r="24"/><circle cx="780" cy="890" r="24"/>
      <circle cx="1180" cy="940" r="24"/><circle cx="1330" cy="640" r="24"/>
    </g>
    <g fill="#ffd166" text-anchor="middle">
      <text x="1180" y="210">1</text><text x="600" y="200">2</text>
      <text x="985" y="160">3</text><text x="170" y="570">4</text>
      <text x="700" y="480">5</text><text x="780" y="900">6</text>
      <text x="1180" y="950">7</text><text x="1330" y="650">8</text>
    </g>
  </g>

  <!-- tegningshoved -->
  <g>
    <rect x="1000" y="930" width="558" height="110" fill="#0a2344" stroke="#8bbcdf" stroke-width="3"/>
    <path d="M 1000 985 H 1558 M 1300 930 V 1040" stroke="#8bbcdf" stroke-width="2"/>
    <g font-family="system-ui, sans-serif" fill="#dbe9ff">
      <text x="1020" y="968" font-size="26" font-weight="800" letter-spacing="2">SNIT A–A</text>
      <text x="1020" y="1020" font-size="22" font-weight="600" fill="#8bbcdf">Hytte i træ · 1:20</text>
      <text x="1320" y="968" font-size="22" font-weight="600" fill="#8bbcdf">MÅL I MM</text>
      <text x="1320" y="1020" font-size="22" font-weight="600" fill="#8bbcdf">TEGN. NR. 04</text>
    </g>
  </g>

  <g font-family="system-ui, sans-serif" fill="#8bbcdf" font-weight="700">
    <text x="80" y="110" font-size="40" letter-spacing="2" fill="#dbe9ff">TEKNISK TEGNING</text>
    <text x="82" y="148" font-size="22" letter-spacing="6">SEKTION · BYGNINGSDEL 1–8</text>
  </g>
</svg>
